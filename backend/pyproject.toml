[project]
name = "archdraft"
version = "0.1.0"
description = "Requirements-to-architecture generator with requirement traceability, built on Google ADK."
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.11.0",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.14",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["archdraft*"]

[tool.setuptools.package-data]
"archdraft.agents" = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
